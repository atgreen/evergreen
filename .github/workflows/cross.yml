#
# The ports. scripts/cross-port.sh, Cross.toml and packaging/fedora all treat
# AArch64, POWER, IBM Z and Android as supported, and none of them was built in
# CI — so a codegen change that declines or miscompiles on a non-x86 backend was
# only ever caught by hand on this laptop.
#
# `cross` rather than a local toolchain: Cross.toml already pins the container
# image per target (including the Android image chosen for its NDK version —
# bliss-w2vp), so the images decide the sysroots and this workflow does not
# duplicate that knowledge.
#
# Those images ship qemu-user, so the runtime tests can be RUN and not merely
# built. egcl-rt is the crate whose assumptions are architecture-specific
# (native transfer, the JIT emitters, atomics); running its suite under qemu is
# the part that actually proves a port.

name: cross

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      preserve_run:
        description: Preserve explicitly requested validation, including scheduled callers
        type: boolean
        default: true

permissions:
  contents: read

# Cancel stale automatic nightly runs, while explicit validations remain
# independent even when a reusable caller inherited a schedule event.
concurrency:
  group: cross-intensive-v1-${{ github.workflow }}-${{ github.event_name == 'schedule' && !inputs.preserve_run && format('scheduled-{0}', github.ref) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'schedule' && !inputs.preserve_run }}

env:
  CARGO_TERM_COLOR: always
  # Backtraces on panic. Free — printed only when something fails — and it pays
  # for itself on unwrap()/expect() failures inside shared helpers, where the
  # reported file:line is the helper rather than the caller. It would NOT have
  # helped the failures that prompted it: those were assert! calls whose own
  # messages already said everything (e.g. "missing bundled ASDF bfasl: <path>").
  # `1`, not `full`: full adds pages of runtime frames and buries the useful ones.
  RUST_BACKTRACE: 1

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One failing architecture must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            run_tests: true
            qemu_ld_prefix: /usr/aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
          - target: powerpc64le-unknown-linux-gnu
            run_tests: true
            qemu_ld_prefix: /usr/powerpc64le-linux-gnu
            cc: powerpc64le-linux-gnu-gcc
          - target: s390x-unknown-linux-gnu
            run_tests: true
            qemu_ld_prefix: /usr/s390x-linux-gnu
            cc: s390x-linux-gnu-gcc
          - target: riscv64gc-unknown-linux-gnu
            run_tests: true
            qemu_ld_prefix: /usr/riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cross
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cross-${{ matrix.target }}
      - name: build the workspace for ${{ matrix.target }}
        run: cross build --workspace --release --target ${{ matrix.target }}
      # Fifteen egcl-rt tests re-execute themselves for process isolation
      # (Command::new(current_exe()) in gc.rs, safepoint.rs, thread.rs), so they
      # exec a TARGET-architecture ELF directly. With no binfmt_misc handler the
      # kernel returns ENOEXEC, glibc's execvp falls back to `/bin/sh <file>`, and
      # sh parses the ELF header: `Syntax error: "(" unexpected`.
      #
      # This is the half of bliss-d3smh that was measured but never installed.
      # That fix was verified on a laptop whose kernel already had the handlers
      # registered WITH THE F FLAG (interpreter /usr/bin/qemu-aarch64-static,
      # flags: F): F opens the static qemu at REGISTRATION time, so it works
      # inside a container that ships no qemu on its own PATH. QEMU_LD_PREFIX then
      # lets that qemu find ld-linux-aarch64.so.1. So the env var below is
      # necessary but NOT sufficient — binfmt is what invokes qemu at all on a
      # nested exec. ubuntu-latest registers nothing, so the job sat at exactly
      # the pre-fix 105 passed / 15 failed (bliss-3c385).
      #
      # Registration is host-wide and affects only nested execs: cross's own
      # in-container runner for the top-level test binary is untouched.
      - name: register qemu binfmt handlers (nested exec of target binaries)
        if: matrix.run_tests
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: run the runtime suite under qemu
        if: matrix.run_tests
        env:
          # How the emulated child above finds the target dynamic loader: the
          # target RUNNER's -L covers the test binary itself, not what it execs.
          # Cross.toml passes this through into the container.
          QEMU_LD_PREFIX: ${{ matrix.qemu_ld_prefix }}
          # ffi_elf_loader compiles a shared library at run time and loads it.
          # The container's plain `cc` targets the HOST, so it produced an x86-64
          # library for a target-architecture process and the loader refused it.
          # NOT named CC: cargo and cc-rs own that name for building the crate.
          EGCL_TEST_CC: ${{ matrix.cc }}
        # Fiber tests exercise the native context backends on all three targets.
        # Non-x86 signal-PC rewriting is separately unported; those deliberate
        # guard-fault tests are not evidence that QEMU cannot run fibers.
        run: cross test -p egcl-rt --release --target ${{ matrix.target }}

  # Android, built through packaging/android/build-runtime.py — the same script
  # the RPM's %build calls (packaging/fedora/egcl.spec). A hand-rolled
  # `cross rustc --crate-type cdylib` was wrong in every detail that matters:
  #
  #   * ONE ABI instead of two. HOSTS in that script is
  #     {aarch64-linux-android: arm64-v8a, x86_64-linux-android: x86_64} —
  #     ARM64 phones AND x86-64 emulators. The RPM's target-android subpackage
  #     ships both; building one produces a package that cannot run on an
  #     emulator.
  #   * No 16 KiB page alignment. The script links with
  #     -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384, which recent
  #     Android requires, and then VERIFIES the load/RELRO layout in check_elf.
  #     A .so without it is the wrong artifact even for the ABI it did build.
  #   * The wrong linker. It must be the NDK's <host>28-clang — API 28 is the
  #     min_sdk the generator writes into app.json — not cross's container
  #     toolchain.
  #   * No metadata. The script records api version 4 (which must match
  #     egcl_android_api_version in crates/egcl-android), the workspace version,
  #     min_sdk, the NDK's source.properties and a per-ABI sha256;
  #     egcl-android-new checks app.json against it.
  #
  # The runner's preinstalled NDK is used rather than a downloaded one, and
  # --offline is deliberately NOT passed: that flag is for the RPM's vendored
  # crates, and there is no vendor/ directory here.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: add both Android ABIs
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: android
      - name: report which NDK this runner ships
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"
      - name: build both application runtimes
        run: |
          python3 packaging/android/build-runtime.py             --ndk "$ANDROID_NDK_LATEST_HOME"             --stage "$RUNNER_TEMP/android-stage"
      # The RPM's %check runs these three; a generator that disagrees with the
      # runtime metadata breaks APK builds on a user's machine, not here.
      - name: generator and packaging contracts
        run: |
          python3 packaging/android/test_generator.py
          python3 packaging/android/test_build.py
          python3 packaging/android/test_install_tools.py
      - name: keep the staged runtimes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egcl-android-runtimes
          path: ${{ runner.temp }}/android-stage/usr/
          if-no-files-found: error
