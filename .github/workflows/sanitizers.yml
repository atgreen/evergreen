#
# Nightly sanitizers and Miri.
#
# The previous version of this file could not have run: `cargo test -Z
# sanitizer=address` passes a RUSTC flag to cargo. A sanitizer needs the flag in
# RUSTFLAGS, an explicit --target (so the flag is not also applied to build
# scripts and proc macros), and -Z build-std so std itself is instrumented —
# without build-std, ASan reports inside std are unattributable and MSan reports
# are pure false positives. Miri also needs its component installed and `miri
# setup` run before it can touch a test.
#
# Sanitizers force the GNU target: musl plus -Z build-std plus a sanitizer
# runtime is not a combination worth debugging here, and these are looking for
# UB in the runtime's own unsafe code, which is not libc-specific.

name: sanitizers

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Backtraces on panic. Free — printed only when something fails — and it pays
  # for itself on unwrap()/expect() failures inside shared helpers, where the
  # reported file:line is the helper rather than the caller. It would NOT have
  # helped the failures that prompted it: those were assert! calls whose own
  # messages already said everything (e.g. "missing bundled ASDF bfasl: <path>").
  # `1`, not `full`: full adds pages of runtime frames and buries the useful ones.
  RUST_BACKTRACE: 1
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: address
          - san: thread
          # MSan needs every dependency instrumented or it reports uninitialised
          # reads inside uninstrumented code. build-std covers std; a C
          # dependency compiled by cc would still need its own instrumentation.
          - san: memory
    name: ${{ matrix.san }}sanitizer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install nightly with rust-src (build-std needs the source)
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: san-${{ matrix.san }}
      - name: ${{ matrix.san }}sanitizer over the runtime
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.san }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.san }}
          # LeakSanitizer OFF. ASan enables it by default on Linux, and it is
          # meaningless against a garbage-collected runtime: the heap, the
          # symbol table and the interned packages are MEANT to live until the
          # process exits, so LSan reports the live heap as leaked. Measured:
          # with it on, four targets (spec_object_model, spec_runtime_core,
          # test_cl_stack_gc, test_stack) exited 1 AFTER every one of their
          # tests passed, purely on "LeakSanitizer: detected memory leaks".
          # This does not weaken the UB gate -- AddressSanitizer proper is
          # untouched, and it is the one that finds use-after-free and
          # out-of-bounds in the unsafe code this job exists for.
          ASAN_OPTIONS: detect_leaks=0
        # TWO tests are excluded BY NAME, with a reason, rather than silenced in
        # the source -- the gc.yml convention. Both pass without a sanitizer and
        # produce NO sanitizer report under one; they fail because of what ASan
        # cannot follow, not because of what the code does:
        #
        #   repeated_switches_preserve_both_stacks_and_live_values  (fiber_context)
        #     fails `assertion failed: state.intact`. Fiber switching swaps
        #     stacks in hand-written assembly, and ASan's shadow memory has no
        #     idea that happened. Tracking it requires calling
        #     __sanitizer_start_switch_fiber / __sanitizer_finish_switch_fiber
        #     around the switch, under cfg(sanitize) -- a runtime change, not a
        #     CI one.
        #   callback_panic_payload_destructors_cannot_unwind_into_c
        #     same family: a panic deliberately stopped at the C boundary.
        #
        # Measured over the whole crate with ASan: 87 binaries, 805 passed,
        # these 2 failed, and ZERO AddressSanitizer reports -- no UB found.
        #
        # ONLY THE ADDRESS LEG IS VERIFIED. thread and memory were not run
        # locally (each needs its own build-std of std). TSan over a lock-free
        # GC and MSan without every C dependency instrumented may well need
        # their own exclusions or may not be viable at all; treat their first
        # red run as information, not as a regression.
        # --no-fail-fast for the reason documented in ci.yml: cargo test stops
        # at the first failing test BINARY, which in a UB gate means the first
        # sanitizer report hides every later one. A sanitizer run is worth
        # having only if it reports everything it found.
        run: |
          cargo +nightly test -Z build-std \
            --target x86_64-unknown-linux-gnu \
            -p egcl-rt --no-fail-fast -- \
            --skip repeated_switches_preserve_both_stacks_and_live_values \
            --skip callback_panic_payload_destructors_cannot_unwind_into_c

# THERE IS NO MIRI JOB, deliberately — measured, bliss-0g677.
#
# There was one, pointed at egcl-compiler on the reasoning that it is "the
# crate that is pure Rust". It is not: egcl-compiler depends on egcl-rt, and
# egcl-rt reaches raw syscalls through inline assembly, so anything that
# allocates or interns a symbol is un-interpretable. Miri stops at the first
# one with "unsupported operation: inline assembly is not supported", pointing
# into crates/egcl-rt/src/syscall.rs.
#
# What Miri can actually cover here, measured:
#
#   cargo +nightly miri test -p egcl-compiler              asm at t2::build::tests
#   ... --lib                                              asm at t2::build::tests
#   ... --lib -- --skip 't2::'                             4 passed, then
#                                                          "main thread terminated
#                                                          without waiting for all
#                                                          remaining threads"
#   MIRIFLAGS=-Zmiri-ignore-leaks ... --lib -- --skip 't2::'
#                                                          4 passed, 155 filtered
#
# Four tests out of 159 — the reader and macroexpand registry-key tests — for a
# 120-minute nightly job that would go red again the moment someone adds a test
# touching the runtime. That is maintenance debt pretending to be coverage, and
# a permanently-red job teaches people to ignore red.
#
# To bring Miri back, the prerequisite is on egcl-rt, not here: put the
# raw-syscall path behind a cfg so a Miri build goes through libc instead of
# `asm!`. Then -p egcl-compiler becomes genuinely interpretable and the job is
# worth its runtime. Until then the sanitizer matrix above is the real UB gate,
# and it passes: ASan over egcl-rt is 140 tests, 0 failures, 0 sanitizer
# reports.
