name: Fedora releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'test publishes a prerelease; build only uploads workflow artifacts'
        type: choice
        options: [test, build]
        default: test
        required: true

permissions:
  contents: read

# One release in flight per ref. Two runs for the same tag otherwise race
# `gh release create`, and the loser publishes nothing while the winner may
# publish assets the other run verified. Queue rather than cancel: a cancelled
# run that has already created the draft leaves that draft behind (the same
# reasoning as docs.yml's pages group).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full regression is paid once for a release, not on every intermediate PR.
  # This runs alongside packaging and must pass before publication.
  validation:
    if: inputs.mode != 'build'
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-repo caller; retain actionlint-compatible syntax
    with:
      suite: full
      preserve_run: true

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check packaging contracts
        run: |
          python3 packaging/fedora/test-release.py
          python3 packaging/fedora/test-sbom.py
          python3 packaging/fedora/test-source-rpm.py
          python3 packaging/fedora/test-riscv-rpm.py
          python3 packaging/fedora/test-compare-rpms.py
          python3 packaging/fedora/test-repo.py
          python3 packaging/fedora/test-static-package.py
          python3 packaging/fedora/test-native-content.py
          python3 packaging/fedora/test-cross-launcher.py
          python3 packaging/fedora/test-launcher.py
      - name: Plan release
        id: plan
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: python3 packaging/fedora/release.py plan

  source:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore release plan
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.plan_json }}
        run: |
          mkdir -p target
          python3 - <<'PYPLAN'
          import json, os
          from pathlib import Path
          Path('target/release-plan.json').write_text(json.dumps(json.loads(os.environ['RELEASE_PLAN'])) + '\n')
          PYPLAN
      - name: Install container runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build shared source RPM
        run: |
          set -o pipefail
          sudo bash packaging/fedora/ci-container.sh source 2>&1 | tee target/fedora-release.log
      - name: Upload source RPM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-srpm
          path: target/fedora-rpm/SRPMS/*.src.rpm
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-sbom
          path: target/egcl-sbom.cdx.json
          if-no-files-found: error
          overwrite: true
      - name: Upload source build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-log-source
          path: target/fedora-release.log
          if-no-files-found: ignore
          overwrite: true

  binaries:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # `name` is the job and artifact label, `group` what build.py builds,
        # `arch` the RPMS/<arch>/ directory rpmbuild writes into. The two
        # `native` entries differ only by the architecture they build FOR,
        # which is why the label cannot just be the group.
        include:
          - { name: native,  group: native,  arch: x86_64, platform: '', timeout: 120 }
          - { name: s390x,   group: s390x,   arch: x86_64, platform: '', timeout: 120 }
          - { name: aarch64, group: aarch64, arch: x86_64, platform: '', timeout: 120 }
          - { name: ppc64le, group: ppc64le, arch: x86_64, platform: '', timeout: 120 }
          - { name: riscv64, group: riscv64, arch: x86_64, platform: '', timeout: 120 }
          - { name: windows, group: windows, arch: x86_64, platform: '', timeout: 120 }
          - { name: android, group: android, arch: x86_64, platform: '', timeout: 120 }
          # POWER-native packages remain supported by the SRPM, but this job is
          # disabled until the emulated build has a usable native OpenJDK.
          # - { name: ppc64le-native, group: native, arch: ppc64le,
          #     platform: linux/ppc64le, timeout: 300 }
          # Native s390x and aarch64 are NOT here yet, and the reason is
          # specific: they need contradictory qemu versions. aarch64 cannot
          # extract the source tarball under qemu 9.2.2 (tar gets EINVAL on
          # every mkdir), and under 10.2.2 -- which does extract it -- systemd's
          # user@0.service never starts, on every architecture including this
          # one. So the version that fixes tar breaks the container, and no
          # single version works for both yet. The likely lever is the binfmt
          # registration flags rather than the version: this image registers
          # OCF, while Fedora's shipped conf uses only F, and C (credentials)
          # is a plausible requirement of user@0.service. Everything else for
          # those two arches is already in place -- ExclusiveArch, the pinned
          # rustup digests, release.py's package sets and verify.py's
          # HOST_FEATURES -- so re-adding them is two matrix entries and two
          # --rpm-dir lines once that is settled.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora44-srpm
          path: target/srpm
      - name: Install container runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Register foreign-architecture emulation
        if: ${{ matrix.platform != '' }}
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          # Ubuntu 24.04's qemu-user-static is QEMU 8.2, and it is too old to
          # emulate a Fedora 44 userland: the container builds and dnf runs, but
          # rpmbuild's %prep dies with GNU tar unable to create a single
          # directory --
          #     tar: egcl-source/.cargo: Cannot mkdir: Function not implemented
          # -- 6732 ENOSYS errors, having extracted nothing, while %mkbuilddir
          # created directories in the same place moments earlier. The same
          # extraction of the same ppc64le tar succeeds under QEMU 10.2.2
          # locally, so this is a syscall glibc 2.43 needs and 8.2 lacks.
          #
          # Hence a binfmt installer image, pinned by digest -- the objection to
          # one was that it was an unpinned input, not that it was third-party,
          # and apt's snapshot is itself unpinned. It registers handlers with
          # binfmt's F flag, so the static qemu is opened at registration time
          # and stays reachable from a container that ships no qemu itself --
          # without F, execve in the container returns ENOEXEC.
          #
          # qemu-v9.2.2 is the newest tag this image publishes. It is ahead of
          # the 8.2 that fails and behind the 10.2.2 known to work; whether it
          # carries the missing syscall is the open question this pin answers.
          sudo podman run --privileged --rm \
            docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 \
            --install "$BUILD_ARCH"
          # Prove the handler exists before starting an hours-long build that
          # would otherwise fail on the container's first RUN.
          test -f "/proc/sys/fs/binfmt_misc/qemu-$BUILD_ARCH"
      - name: Rebuild and verify package group
        env:
          BUILD_GROUP: ${{ matrix.group }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          shopt -s nullglob
          srpms=(target/srpm/*.src.rpm)
          [[ ${#srpms[@]} == 1 ]]
          # `sudo env`, not a plain `sudo`: sudo drops the environment, so the
          # platform would silently be lost and the job would build x86_64
          # packages under the POWER job's name.
          sudo env "EGCL_CONTAINER_PLATFORM=$BUILD_PLATFORM" \
            bash packaging/fedora/ci-container.sh binary "$BUILD_GROUP" "${srpms[0]}" \
            2>&1 | tee target/fedora-release.log
      - name: Upload verified RPMs and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.name }}
          # One provenance record per builder, named by source-rpm.py's
          # provenance_name() -- a glob rather than a spelling to keep in step.
          path: |
            target/fedora-rpm/RPMS/${{ matrix.arch }}/*.rpm
            target/build-provenance/*.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Upload build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-log-${{ matrix.name }}
          path: target/fedora-release.log
          if-no-files-found: ignore
          overwrite: true

  collect:
    needs: [plan, source, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora44-srpm
          path: target/srpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora44-sbom
          path: target/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: target/release-input
          merge-multiple: true
      - name: Restore release plan
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.plan_json }}
        run: |
          mkdir -p target
          python3 - <<'PYPLAN'
          import json, os
          from pathlib import Path
          Path('target/release-plan.json').write_text(json.dumps(json.loads(os.environ['RELEASE_PLAN'])) + '\n')
          PYPLAN
      - name: Validate and collect release assets
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          shopt -s nullglob
          srpms=(target/srpm/*.src.rpm)
          [[ ${#srpms[@]} == 1 ]]
          # The collector requires the complete package set from every enabled
          # builder before anything is published.
          python3 packaging/fedora/release.py collect \
            --rpm-dir target/release-input/fedora-rpm/RPMS/x86_64 \
            --source-rpm "${srpms[0]}" --provenance-dir target/release-input/build-provenance \
            --sbom target/sbom/egcl-sbom.cdx.json
      - name: Upload complete release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedora44-rpms
          path: target/release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [plan, collect, validation]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # workflow_dispatch is the recursion-safe handoff to repository.yml:
      # release events created with GITHUB_TOKEN do not start more workflows.
      actions: write
      # Artifact attestations: id-token mints the OIDC token that proves which
      # workflow ran, attestations writes the signed statement to GitHub's store.
      id-token: write
      attestations: write
    # The only job that writes to the repository, and the only one holding the
    # RPM signing key. An environment keeps those secrets out of every other
    # workflow and restricts which refs may deploy at all.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedora44-rpms
          path: assets
      - name: Sign the packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.EGCL_RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.EGCL_RELEASE_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg
          # Check the hand-off from collect BEFORE signing rewrites the headers:
          # after signing, these digests are expected to be stale.
          (cd assets && sha256sum --check SHA256SUMS)
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/passphrase" --import
          # Signs in place, proves each package verifies against the committed
          # public key, then rewrites SHA256SUMS over the signed bytes.
          python3 packaging/fedora/release.py sign --assets assets \
            --passphrase-file "$RUNNER_TEMP/passphrase"
          shred -u "$RUNNER_TEMP/passphrase"
          rm -rf "$GNUPGHOME"
      # Binds every package's digest to this workflow, this repository and this
      # commit, verifiable with `gh attestation verify`. Runs on the SIGNED
      # bytes, so the attested digests are the ones users download. This is
      # SLSA v1.0 Build L2; L3 would need provenance generated by a reusable
      # workflow isolated from this one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'assets/*.rpm'
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'assets/*.rpm'
          sbom-path: 'assets/egcl-sbom.cdx.json'
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          COMMIT: ${{ github.sha }}
        run: |
          cd assets
          sha256sum --check SHA256SUMS
          flags=(--verify-tag)
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--target "$COMMIT" --prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --draft "${flags[@]}" \
            --title "EGCL $RELEASE_TAG" --notes-file RELEASE_NOTES.md ./*
          gh release edit "$RELEASE_TAG" --draft=false
          # Test mode publishes a real prerelease so the publish path itself is
          # exercised, but nothing ever read the older ones -- they just
          # accumulate on a public release page. Keep the newest three. The
          # filter is deliberately narrow: prereleases whose tag starts with
          # test-v, which only this workflow creates.
          if [[ "$PRERELEASE" == true ]]; then
            gh release list --limit 100 --json tagName,isPrerelease,createdAt --jq \
              '[.[] | select(.isPrerelease and (.tagName | startswith("test-v")))]
               | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r stale; do
                [[ -n "$stale" ]] || continue
                echo "Pruning stale test prerelease: $stale"
                gh release delete "$stale" --yes --cleanup-tag
              done
          fi
      - name: Publish DNF repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh workflow run repository.yml --ref main -f tag="$RELEASE_TAG"
