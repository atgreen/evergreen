name: Fedora releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'test publishes a prerelease; build only uploads workflow artifacts'
        type: choice
        options: [test, build]
        default: test
        required: true

permissions:
  contents: read

# One release in flight per ref. Two runs for the same tag otherwise race
# `gh release create`, and the loser publishes nothing while the winner may
# publish assets the other run verified. Queue rather than cancel: a cancelled
# run that has already created the draft leaves that draft behind (the same
# reasoning as docs.yml's pages group).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check packaging contracts
        run: |
          python3 packaging/fedora/test-release.py
          python3 packaging/fedora/test-sbom.py
          python3 packaging/fedora/test-static-package.py
          python3 packaging/fedora/test-native-content.py
          python3 packaging/fedora/test-cross-launcher.py
          python3 packaging/fedora/test-launcher.py
      - name: Plan release
        id: plan
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: python3 packaging/fedora/release.py plan

  source:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore release plan
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.plan_json }}
        run: |
          mkdir -p target
          python3 - <<'PYPLAN'
          import json, os
          from pathlib import Path
          Path('target/release-plan.json').write_text(json.dumps(json.loads(os.environ['RELEASE_PLAN'])) + '\n')
          PYPLAN
      - name: Install container runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build shared source RPM
        run: |
          set -o pipefail
          sudo bash packaging/fedora/ci-container.sh source 2>&1 | tee target/fedora-release.log
      - name: Upload source RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora44-srpm
          path: target/fedora-rpm/SRPMS/*.src.rpm
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora44-sbom
          path: target/egcl-sbom.cdx.json
          if-no-files-found: error
          overwrite: true
      - name: Upload source build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora44-log-source
          path: target/fedora-release.log
          if-no-files-found: ignore
          overwrite: true

  binaries:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [native, s390x, aarch64, ppc64le, windows, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora44-srpm
          path: target/srpm
      - name: Install container runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Rebuild and verify package group
        env:
          BUILD_GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          shopt -s nullglob
          srpms=(target/srpm/*.src.rpm)
          [[ ${#srpms[@]} == 1 ]]
          sudo bash packaging/fedora/ci-container.sh binary "$BUILD_GROUP" "${srpms[0]}" \
            2>&1 | tee target/fedora-release.log
      - name: Upload verified RPMs and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.group }}
          path: |
            target/fedora-rpm/RPMS/x86_64/*.rpm
            target/build-provenance/${{ matrix.group }}.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Upload build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora44-log-${{ matrix.group }}
          path: target/fedora-release.log
          if-no-files-found: ignore
          overwrite: true

  collect:
    needs: [plan, source, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora44-srpm
          path: target/srpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora44-sbom
          path: target/sbom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: target/release-input
          merge-multiple: true
      - name: Restore release plan
        env:
          RELEASE_PLAN: ${{ needs.plan.outputs.plan_json }}
        run: |
          mkdir -p target
          python3 - <<'PYPLAN'
          import json, os
          from pathlib import Path
          Path('target/release-plan.json').write_text(json.dumps(json.loads(os.environ['RELEASE_PLAN'])) + '\n')
          PYPLAN
      - name: Validate and collect release assets
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          shopt -s nullglob
          srpms=(target/srpm/*.src.rpm)
          [[ ${#srpms[@]} == 1 ]]
          python3 packaging/fedora/release.py collect \
            --rpm-dir target/release-input/fedora-rpm/RPMS/x86_64 \
            --source-rpm "${srpms[0]}" --provenance-dir target/release-input/build-provenance \
            --sbom target/sbom/egcl-sbom.cdx.json
      - name: Upload complete release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora44-rpms
          path: target/release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [plan, collect]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Artifact attestations: id-token mints the OIDC token that proves which
      # workflow ran, attestations writes the signed statement to GitHub's store.
      id-token: write
      attestations: write
    # The only job that writes to the repository, and the only one holding the
    # RPM signing key. An environment keeps those secrets out of every other
    # workflow and restricts which refs may deploy at all.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora44-rpms
          path: assets
      - name: Sign the packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.EGCL_RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.EGCL_RELEASE_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gnupg
          # Check the hand-off from collect BEFORE signing rewrites the headers:
          # after signing, these digests are expected to be stale.
          (cd assets && sha256sum --check SHA256SUMS)
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/passphrase" --import
          # Signs in place, proves each package verifies against the committed
          # public key, then rewrites SHA256SUMS over the signed bytes.
          python3 packaging/fedora/release.py sign --assets assets \
            --passphrase-file "$RUNNER_TEMP/passphrase"
          shred -u "$RUNNER_TEMP/passphrase"
          rm -rf "$GNUPGHOME"
      # Binds every package's digest to this workflow, this repository and this
      # commit, verifiable with `gh attestation verify`. Runs on the SIGNED
      # bytes, so the attested digests are the ones users download. This is
      # SLSA v1.0 Build L2; L3 would need provenance generated by a reusable
      # workflow isolated from this one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'assets/*.rpm'
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'assets/*.rpm'
          sbom-path: 'assets/egcl-sbom.cdx.json'
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          COMMIT: ${{ github.sha }}
        run: |
          cd assets
          sha256sum --check SHA256SUMS
          flags=(--verify-tag)
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--target "$COMMIT" --prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --draft "${flags[@]}" \
            --title "EGCL $RELEASE_TAG" --notes-file CHANGELOG.md ./*
          gh release edit "$RELEASE_TAG" --draft=false
          # Test mode publishes a real prerelease so the publish path itself is
          # exercised, but nothing ever read the older ones -- they just
          # accumulate on a public release page. Keep the newest three. The
          # filter is deliberately narrow: prereleases whose tag starts with
          # test-v, which only this workflow creates.
          if [[ "$PRERELEASE" == true ]]; then
            gh release list --limit 100 --json tagName,isPrerelease,createdAt --jq \
              '[.[] | select(.isPrerelease and (.tagName | startswith("test-v")))]
               | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r stale; do
                [[ -n "$stale" ]] || continue
                echo "Pruning stale test prerelease: $stale"
                gh release delete "$stale" --yes --cleanup-tag
              done
          fi
