#
# The GC-safety gate. AGENTS.md makes a clean EGCL_GC_STRESS run the required
# evidence for any change that allocates, because the moving collector turns
# missing roots into intermittent, load-dependent segfaults that ordinary tests
# pass straight through. Nothing in CI exercised those knobs before this, which
# is why this is a workflow rather than a step.
#
# The three knobs, and why all three:
#   EGCL_GC_STRESS=1  fire a minor GC on (almost) every allocation, so a value
#                     left unrooted across an allocation moves under the holder.
#   EGCL_GC_POISON=1  fill freed nursery with a non-canonical pattern, so a stale
#                     deref segfaults at once instead of quietly reading moved data.
#   EGCL_GC_VERIFY=1  after relocation, walk every root slot and live field and
#                     panic on any reference still pointing into the freed range.
#                     This is the one that catches a root the scanner SKIPS —
#                     stress and poison only catch a stale pointer being read, and
#                     a clean run over objects that never moved proves nothing.
#
# Scope: stress fires a collection per allocation, so the full acceptance suite
# under it takes hours. The PR job runs an allocation-heavy subset; the scheduled
# job runs the whole thing.

name: gc

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC, before the fuzz (04:00) and sanitizer (05:00) nightlies.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Backtraces on panic. Free — printed only when something fails — and it pays
  # for itself on unwrap()/expect() failures inside shared helpers, where the
  # reported file:line is the helper rather than the caller. It would NOT have
  # helped the failures that prompted it: those were assert! calls whose own
  # messages already said everything (e.g. "missing bundled ASDF bfasl: <path>").
  # `1`, not `full`: full adds pages of runtime frames and buries the useful ones.
  RUST_BACKTRACE: 1

jobs:
  # Per-PR: a curated subset, chosen for allocation density rather than breadth —
  # CLOS instances, FFI buffers, closures over captured namespaces, and the
  # tiering paths that hand values across the c2i boundary.
  stress-subset:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # MEASURED, not guessed. Locally, release, this desktop:
    #   stress+poison   4 egcl suites 565s, + all of egcl-rt  =  880s (14.7 min)
    #   verify+stress   the same 4 suites alone               = 1287s (21.4 min)
    # The verify leg is ~2.3x the stress leg, and a hosted 4-vCPU runner is slower
    # than this machine, so the budget is set for verify-on-CI plus the release
    # build rather than for the fast leg.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stress+poison
            env: EGCL_GC_STRESS=1 EGCL_GC_POISON=1
          - name: verify
            env: EGCL_GC_VERIFY=1 EGCL_GC_STRESS=1
    name: ${{ matrix.name }} (subset)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gc
      # Release, because stress multiplies the collection count and a debug
      # runtime makes the subset itself time out.
      - name: build the test binaries
        run: cargo test --release --no-run -p egcl -p egcl-rt
      # tier_observability is NOT in this list, though it used to be. Its tests
      # drive tier promotion with loops of 2000-6000 iterations, and under stress
      # every allocating iteration pays a full collection: the suite runs in 8.8s
      # normally and had not finished a SINGLE test after 21 minutes under
      # stress+poison. That one suite is why this workflow never completed a run
      # (bliss-d3smh). The scheduled full job below still covers it, with a
      # 350-minute budget.
      - name: ${{ matrix.name }}
        run: |
          env ${{ matrix.env }} cargo test --release -p egcl \
            --test ffi_memory_cli \
            --test function_object_dispatch_cli \
            --test defun_redefinition_retires_bytecode_cli \
            --test setf_function_names_cli
          # egcl-rt stays: measured at ~5 minutes under stress, so it was never
          # the expensive part -- I assumed it was and was wrong. One test is
          # excluded by name, not silenced in the source, because it is a real
          # unexplained failure and should stay visible: bliss-ddqhv, a safepoint
          # handshake reporting 0/1 arrived under stress.
          env ${{ matrix.env }} cargo test --release -p egcl-rt -- \
            --skip t0_alloc_typed_observes_safepoints_before_touching_its_tlab

  # Scheduled: the whole suite under stress, which is where a rarely-exercised
  # path gets its collection. Allowed the full timeout budget.
  stress-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stress+poison
            env: EGCL_GC_STRESS=1 EGCL_GC_POISON=1
          - name: verify
            env: EGCL_GC_VERIFY=1 EGCL_GC_STRESS=1
    name: ${{ matrix.name }} (full)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gc
      - name: ${{ matrix.name }} over the whole workspace
        run: env ${{ matrix.env }} cargo test --release --workspace
