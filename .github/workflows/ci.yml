name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: PGO build orchestration contracts
        run: make test-pgo-build
      - uses: dtolnay/rust-toolchain@stable
      - name: spec coverage gate
        run: python3 scripts/spec-coverage.py --gate
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: gc-root-lint (bliss-jaf — new unrooted-across-alloc candidates fail)
        run: bash scripts/gc-root-lint.sh
      - name: ansi-test
        run: cargo test -p egcl --test spec_validation_infra ansi_expected_failures_and_ci_contracts

  # The Linux build can only cross-compile the Win64 adapter.  Keep a native
  # Windows gate for the SEH/shadow-space transition itself; mitigation refusal
  # is a test failure here rather than a silently skipped ABI claim.
  windows-native-transfer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (Windows workspace)
        run: cargo check --workspace
      - name: Win64 segment ABI execution
        run: cargo test -p egcl-rt --test native_segment_windows -- --include-ignored --nocapture
      - name: Win64 runtime adapter probes
        run: cargo test -p egcl-rt --lib native_transfer -- --include-ignored --nocapture
      - name: Win64 runtime transfer regressions
        run: cargo test -p egcl --test native_transfer_cli --test tier_observability
