name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: spec coverage gate
        run: python3 scripts/spec-coverage.py --gate
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: gc-root-lint (bliss-jaf — new unrooted-across-alloc candidates fail)
        run: bash scripts/gc-root-lint.sh
      - name: ansi-test
        run: cargo test -p torcl --test spec_validation_infra ansi_expected_failures_and_ci_contracts
