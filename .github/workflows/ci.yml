# PRs/main use one Linux build and a bounded regression selection. Full suites
# reuse immutable build artifacts across named-test shards nightly or on demand.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Validation tier'
        type: choice
        options: [fast, full]
        default: full
  workflow_call:
    inputs:
      suite:
        type: string
        default: full
      preserve_run:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-tiered-v1-${{ !inputs.preserve_run && github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || !inputs.preserve_run && github.event_name == 'push' && format('push-{0}', github.ref) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ !inputs.preserve_run && (github.event_name == 'pull_request' || github.event_name == 'push') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.select.outputs.runtime }}
      full: ${{ steps.select.outputs.full }}
      areas: ${{ steps.select.outputs.areas }}
      pgo: ${{ steps.select.outputs.pgo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test CI selection and shard runner contracts
        run: |
          python3 scripts/test_ci_plan.py
          python3 scripts/test_ci_tests.py
      - name: Select validation tier
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_SUITE: ${{ inputs.suite || 'fast' }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: python3 scripts/ci-plan.py --event "$CI_EVENT" --suite "$CI_SUITE" --base "$CI_BASE" --head "$CI_HEAD" --output "$GITHUB_OUTPUT"

  lint:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
      - name: Spec coverage, Clippy, root safety and validation contracts
        run: bash scripts/ci-lint.sh
      - name: PGO orchestration contracts when affected
        if: needs.plan.outputs.pgo == 'true'
        run: make test-pgo-build

  build:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.full == 'true' && '[{"name":"musl","target":"x86_64-unknown-linux-musl","features":""},{"name":"gnu","target":"x86_64-unknown-linux-gnu","features":"egcl-rt/c-ffi"}]' || '[{"name":"musl","target":"x86_64-unknown-linux-musl","features":""}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and target
        env:
          BUILD_TARGET: ${{ matrix.config.target }}
        run: |
          rustup show active-toolchain
          rustup target add "$BUILD_TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tiered-${{ matrix.config.name }}
      - name: Start memory-capped runner session
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Build test artifacts once
        env:
          BUILD_TARGET: ${{ matrix.config.target }}
          BUILD_FEATURES: ${{ matrix.config.features }}
          CI_SUITE: ${{ needs.plan.outputs.full == 'true' && 'full' || 'fast' }}
          CI_SHARDS: ${{ needs.plan.outputs.full == 'true' && '8' || '1' }}
          CI_AREAS: ${{ needs.plan.outputs.areas }}
          EGCL_MEM_MAX: 6G
          EGCL_TIMEOUT: 1200
        run: |
          args=(--suite "$CI_SUITE" --target "$BUILD_TARGET" --shards "$CI_SHARDS" --manifest target/ci-tests/manifest.json)
          if [[ -n "$BUILD_FEATURES" ]]; then args+=(--features "$BUILD_FEATURES"); fi
          while IFS= read -r area; do if [[ -n "$area" ]]; then args+=(--area "$area"); fi; done < <(python3 -c 'import json,os; print("\n".join(json.loads(os.environ["CI_AREAS"])))')
          scripts/egcl-limited.sh python3 scripts/ci-tests.py build "${args[@]}"
      - name: Startup and basic evaluation smoke
        env:
          BUILD_TARGET: ${{ matrix.config.target }}
        run: scripts/egcl-limited.sh "target/$BUILD_TARGET/release/egcl" --no-init --eval '(assert (= 42 (+ 20 22))) (format t "CI-SMOKE-OK~%")'
      - name: Doctests in the full configuration
        if: needs.plan.outputs.full == 'true'
        env:
          BUILD_TARGET: ${{ matrix.config.target }}
          BUILD_FEATURES: ${{ matrix.config.features }}
        run: |
          args=(test --workspace --doc --release --target "$BUILD_TARGET" --no-fail-fast)
          if [[ -n "$BUILD_FEATURES" ]]; then args+=(--features "$BUILD_FEATURES"); fi
          cargo "${args[@]}"
      - name: Package exact build outputs with executable permissions
        run: |
          python3 scripts/ci-tests.py archive --manifest target/ci-tests/manifest.json --output target/ci-tests/archive-files.list
          tar --null -czf "$RUNNER_TEMP/ci-tests.tar.gz" -T target/ci-tests/archive-files.list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tests-${{ matrix.config.name }}
          path: ${{ runner.temp }}/ci-tests.tar.gz
          retention-days: 2
          if-no-files-found: error

  regression:
    needs: [plan, build]
    if: needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.full == 'true' && '["musl","gnu"]' || '["musl"]') }}
        shard: ${{ fromJSON(needs.plan.outputs.full == 'true' && '[0,1,2,3,4,5,6,7]' || '[0]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-tests-${{ matrix.config }}
          path: ${{ runner.temp }}/ci-artifact
      - name: Restore the single producer build
        run: tar -xzf "$RUNNER_TEMP/ci-artifact/ci-tests.tar.gz"
      - name: Install the pinned runtime toolchain
        run: rustup show active-toolchain
      - name: Start memory-capped runner session
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Run the selected shard without rebuilding
        env:
          CI_SHARD: ${{ matrix.shard }}
          EGCL_MEM_MAX: 6G
          EGCL_TIMEOUT: ${{ needs.plan.outputs.full == 'true' && '2400' || '600' }}
        run: scripts/egcl-limited.sh python3 scripts/ci-tests.py run --manifest target/ci-tests/manifest.json --shard "$CI_SHARD" --results "target/ci-tests/results-$CI_SHARD.json"
      - name: Preserve timings and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-${{ matrix.config }}-${{ matrix.shard }}
          path: target/ci-tests/
          retention-days: 14
          if-no-files-found: error

  ci-required:
    name: ci-required
    if: always()
    needs: [plan, lint, build, regression, windows-native-transfer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require exactly the selected checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUNTIME: ${{ needs.plan.outputs.runtime }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.regression.result }}
          FULL: ${{ needs.plan.outputs.full }}
          WINDOWS_RESULT: ${{ needs.windows-native-transfer.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$RUNTIME" == true ]]; then
            test "$LINT_RESULT" = success
            test "$BUILD_RESULT" = success
            test "$TEST_RESULT" = success
          else
            test "$RUNTIME" = false
            test "$LINT_RESULT" = skipped
            test "$BUILD_RESULT" = skipped
            test "$TEST_RESULT" = skipped
          fi
          if [[ "$FULL" == true ]]; then
            test "$WINDOWS_RESULT" = success
          else
            test "$FULL" = false
            test "$WINDOWS_RESULT" = skipped
          fi

  windows-native-transfer:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Override the repository's Linux musl target on Windows.
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: add the host target
        run: rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows
      - name: cargo check (Windows workspace)
        run: cargo check --workspace
      - name: Win64 segment ABI execution
        run: cargo test -p egcl-rt --test native_segment_windows -- --include-ignored --nocapture
      - name: Win64 runtime adapter probes
        run: cargo test -p egcl-rt --lib native_transfer -- --include-ignored --nocapture
      - name: Win64 published callable execution and unwind metadata
        env:
          EGCL_NATIVE_TRANSFER: '1'
        run: cargo test -p egcl --lib win64_published_callable -- --include-ignored --test-threads=1
      - name: Win64 runtime transfer regressions
        run: cargo test -p egcl --test native_transfer_cli --test tier_observability
