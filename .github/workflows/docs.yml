name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/test_docs.py'
      - 'crates/egcl/src/cli.rs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/test_docs.py'
      - 'crates/egcl/src/cli.rs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.0.1). Empty publishes dev from main.'
        type: string
        required: false
      alias:
        description: 'Alias to move onto it, and make the default'
        type: string
        default: latest
        required: false

# Publishes to GitHub Pages from Actions. Permissions are per-job: the build only
# reads the repository, and only the deploy job gets pages:write and the id-token
# it needs to prove the artifact came from this workflow.
permissions:
  contents: read

# One Pages deployment at a time, and DON'T cancel in progress — cancelling a
# half-finished deployment can leave the site serving a partial build.
# Queue pending runs rather than replacing them when another push arrives.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python3 scripts/test_docs.py
      - run: mkdocs build --strict
      # Kept for PRs: a reviewer can download the built site without a deployment.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egcl-manual
          path: site/
          if-no-files-found: error

  # Only from main, and only on a push or a deliberate dispatch: a
  # pull_request run has no business replacing the published manual, and Pages
  # deployments are not previewable per-branch anyway.
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for the gh-pages branch, which is the durable state
      # of the published site: mike keeps one directory per docs version there,
      # and the release workflow keeps the signed dnf repository metadata
      # alongside it. Neither can clobber the other, because each commits only
      # its own subtree.
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The one job that must push. mike commits the built docs to
          # gh-pages, so it needs the checkout's credentials.
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Publish this version to the docs branch
        env:
          VERSION: ${{ inputs.version }}
          ALIAS: ${{ inputs.alias }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # mike needs the branch locally to add to it rather than replace it.
          # It creates the branch on the first run, when this fetch finds none.
          git fetch origin gh-pages:gh-pages || echo 'no gh-pages branch yet'
          if [[ -n "$VERSION" ]]; then
            # A release: publish the version and move the alias users follow.
            mike deploy --push --update-aliases "$VERSION" "${ALIAS:-latest}"
            mike set-default --push "${ALIAS:-latest}"
          else
            # A push to main: refresh the development docs only, leaving every
            # released version and the default alias untouched.
            mike deploy --push --update-aliases dev
          fi
          mike list
      - name: Assemble the site from the docs branch
        run: |
          # git archive rather than a worktree: the Pages artifact should hold
          # the published tree and nothing of git's own bookkeeping. This picks
          # up the dnf repository metadata on the branch for free.
          mkdir -p publish
          git archive gh-pages | tar -x -C publish
          find publish -maxdepth 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: publish/
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
