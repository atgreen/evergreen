name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/test_docs.py'
      - 'crates/egcl/src/cli.rs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/test_docs.py'
      - 'crates/egcl/src/cli.rs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Build-only: publication must be authorized and configured separately.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python3 scripts/test_docs.py
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: egcl-manual
          path: site/
          if-no-files-found: error
