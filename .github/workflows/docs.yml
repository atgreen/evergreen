name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/test_docs.py'
      - 'crates/egcl/src/cli.rs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/test_docs.py'
      - 'crates/egcl/src/cli.rs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Publishes to GitHub Pages from Actions. Permissions are per-job: the build only
# reads the repository, and only the deploy job gets pages:write and the id-token
# it needs to prove the artifact came from this workflow.
permissions:
  contents: read

# One Pages deployment at a time, and DON'T cancel in progress — cancelling a
# half-finished deployment can leave the site serving a partial build.
# Queue pending runs rather than replacing them when another push arrives.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python3 scripts/test_docs.py
      - run: mkdocs build --strict
      # Kept for PRs: a reviewer can download the built site without a deployment.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egcl-manual
          path: site/
          if-no-files-found: error
      # The Pages-shaped artifact the deploy job consumes.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/

  # Only from main, and only on a push: a pull_request run has no business
  # replacing the published manual, and Pages deployments are not previewable
  # per-branch anyway.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
