[workspace]
resolver = "2"
members = [
    "crates/egcl-rt",
    "crates/egcl-compiler",
    "crates/egcl-stdlib",
    "crates/egcl",
    "crates/egcl-delivery-macros",
    # The Android NativeActivity shim. Declared rlib so the default musl target
    # can build it; the .so is produced with `cargo rustc --crate-type cdylib`
    # for an Android target (bliss-w2vp).
    "crates/egcl-android",
    "tools/gc-root-lint",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
rust-version = "1.85"

[workspace.dependencies]
egcl-rt = { path = "crates/egcl-rt" }
egcl-compiler = { path = "crates/egcl-compiler" }
egcl-stdlib = { path = "crates/egcl-stdlib" }

[profile.test]
opt-level = 3

# Let release optimization cross the runtime/compiler/stdlib crate boundaries.
# Initial cached Babel loads retire ~9% fewer instructions with this pair
# (bliss-zjwh); development and ordinary test profiles stay unchanged.
[profile.release]
lto = "thin"
codegen-units = 1

# The DEV profile must optimize the same crates the TEST profile does, or the
# two cargo subcommands produce measurably different binaries at the SAME path
# (target/<target>/debug/egcl) and whichever ran last silently decides how
# fast it is. egcl-rt, egcl-stdlib and egcl-compiler hold the GC, the sequence
# library and the lowerer -- most of the hot code -- so leaving them at
# opt-level 0 under `cargo build` while `cargo test` built them at 3 made the
# same source run ~8x slower:
#
#   written by `cargo build --workspace`  100,817,432 bytes  322 ms
#   written by `cargo test --no-run`      112,981,184 bytes   40 ms
#     -- (remove-duplicates <3000 short strings> :test #'equalp), one commit
#
# scripts/ansi-gate.sh defaults to that binary, so whether a chapter passed,
# timed out, or reported a plausible-but-wrong tally depended on which cargo
# subcommand you happened to run last. It cost a session once: chapter runs that
# had been completing started timing out, and the bisect that "found" the cause
# was invalid because the snapshots compared had been built by different
# commands (bliss-em8x).
#
# Optimizing egcl alone -- the one package that is NOT the bottleneck --
# was the original override and is kept for consistency.
[profile.dev.package.egcl]
opt-level = 2

[profile.dev.package.egcl-rt]
opt-level = 2

[profile.dev.package.egcl-stdlib]
opt-level = 2

[profile.dev.package.egcl-compiler]
opt-level = 2
