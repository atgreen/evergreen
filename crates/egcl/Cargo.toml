[package]
name = "egcl"
description = "Evergreen Common Lisp: REPL, image loading, entry point"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "egcl"

[[bin]]
name = "egcl"
path = "src/main.rs"
test = false

[features]
# On by default for the musl target, where it is worth ~29% of a babel load.
# `--no-default-features` (or any non-musl target) falls back to the system
# allocator untouched.
default = ["thread-cache-alloc"]
# Count every Rust-side heap allocation through a wrapping #[global_allocator],
# reported at exit when EGCL_PROBE_ALLOC_COUNT is set. Off by default and zero
# cost when off; two relaxed atomics per allocation when on. perf cannot unwind
# out of musl's malloc, so this is the only way to attribute Rust allocation
# (bliss-iry5, asked for by bliss-sgis).
alloc-count = []
# Embedded CPython as a second object system (spec 2.7.8): the PY package. Needs a
# target whose loader can open libpython, so not the default static musl build.
python = ["egcl-rt/python", "egcl-stdlib/python"]
# A per-thread free-list cache over the system allocator. musl's mallocng has no
# equivalent of glibc's tcache, and that accounts for ~53% of the musl<->glibc
# gap on a babel load (bliss-05as). Mutually exclusive with alloc-count: both
# install a #[global_allocator].
thread-cache-alloc = []

[dependencies]
egcl-delivery-macros = { path = "../egcl-delivery-macros" }
egcl-rt.workspace = true
egcl-compiler.workspace = true
egcl-stdlib.workspace = true
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "nasm", "std"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
