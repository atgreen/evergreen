[package]
name = "torcl-compiler"
description = "TorCL Common Lisp compiler: reader, macroexpand, IR, tiered compilation, codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
torcl-rt.workspace = true
regalloc2 = "0.15.2"

[dev-dependencies]
proptest = "1.6"

[target.'cfg(windows)'.dev-dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "std"] }
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
