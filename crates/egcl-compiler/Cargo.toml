[package]
name = "egcl-compiler"
description = "Evergreen Common Lisp compiler: reader, macroexpand, IR, tiered compilation, codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
egcl-rt.workspace = true
regalloc2 = "0.15.2"

[dev-dependencies]
proptest = "1.6"
iced-x86 = { version = "1.21.0", default-features = false, features = ["decoder", "std"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
