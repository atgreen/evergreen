[package]
name = "egcl-rt"
description = "Evergreen Common Lisp runtime: object model, GC, threads, FFI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Shared native-debug representation for the Lisp debugger and GDB.
# These versions retain compatibility with the workspace Rust minimum.
gimli = { version = "0.32.3", default-features = false, features = ["read", "write", "std"] }
object = { version = "0.37.3", default-features = false, features = ["read_core", "write_std", "elf", "std"] }

# Internal x86-64 OS services use direct syscalls. Linux also needs pthread
# stack-bound queries below; these link statically on musl and do not enable
# the separate dlopen-based c-ffi feature.
libc = { version = "0.2", optional = true }

# The static ELF loader currently supports neither POWER nor IBM Z. These
# targets use the system dynamic loader; their Linux ABI wrappers also use libc.
[target.'cfg(all(unix, not(target_os = "ios"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
elf_loader = { version = "0.16", default-features = false, features = ["use-syscall", "version", "tls"] }

[target.'cfg(any(target_os = "linux", not(target_arch = "x86_64")))'.dependencies]
libc = "0.2"

# The macOS/BSD kqueue I/O poller still uses libc; keep it available off-Linux.
# On Linux the poller still uses epoll via direct syscalls.
[target.'cfg(not(target_os = "linux"))'.dependencies]
libc = "0.2"

[features]
# Opt-in fault injection for cross-crate native continuation tests.
native-transfer-test-hooks = []
default = []
# C-ABI FFI: dlopen-based foreign-library loading. Requires a dynamic loader, so
# it is incompatible with a fully static executable — off by default.
c-ffi = ["dep:libc"]
# Embedded CPython (spec 2.7.8). Resolved through the foreign-library loader
# rather than linked, so it needs c-ffi and a target whose loader can open
# libpython -- which in practice means glibc, not the default static musl.
python = ["c-ffi"]

[dev-dependencies]
# Tests exercise runtime self-hosting by calling libc directly (raise a signal,
# build a pipe for fiber I/O, etc.), including targets without runtime wrappers.
libc = "0.2"

[build-dependencies]
cc = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Networking_WinSock"] }
